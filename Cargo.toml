[package]
name = "snowwt"
version = "0.1.0"
edition = "2024"
keywords = ["snowflake", "jwt", "auth", "login"]
categories = ["authentication"]
homepage = "https://github.com/greybeam/snowwt"
repository = "https://github.com/greybeam/snowwt"
authors = ["Alexander Hall <alexander@greybeam.ai>"]
description = "Snowflake JWT+Login parameter generator"
license = "Apache-2.0 OR MIT"
# Subject to change
rust-version = "1.85"

[lints]
clippy.missing_docs_in_private_items = "warn"
rust.missing_docs = "warn"

[dependencies]
base64 = { version = "0.22.1", default-features = false, features = ["alloc"] }
jsonwebtoken = { version = "10.2.0", default-features = false, features = [
  "rust_crypto",
  "use_pem",
] }
pkcs8 = { version = "0.10.2", features = ["encryption"] }
rsa = "0.9.9"
secrecy = { version = "0.10.3", default-features = false }
serde = { version = "1.0.228", default-features = false }
serde_derive = { version = "1.0.228", default-features = false }
sha2 = { version = "0.10.9", default-features = false }
thiserror = { version = "2.0.17", default-features = false }
typed-json = { version = "0.1.1", default-features = false }


[[bench]]
harness = false
name = "to_request_body"

[dev-dependencies]
criterion = "0.7.0"
rand = "0.8.5"
serde_json = "1.0.145"
